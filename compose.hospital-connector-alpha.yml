services:
  connector-ingress:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${MEDTRUST_CONNECTOR_PKI_ROOT}
        target: /pki
        read_only: true
      - type: bind
        source: ./hospital-connector/nginx/connector-ingress.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    restart: unless-stopped

  hospital-connector:
    build:
      context: .
      dockerfile: hospital-connector/Dockerfile
    ports:
      - "127.0.0.1:18600:18600"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CONNECTOR_DATA_ROOT: /var/lib/medtrust-connector
      CONNECTOR_CENTRAL_URL: http://host.docker.internal:8000/api/v1/connector-control
      CONNECTOR_INGRESS_URL: https://connector-ingress:8443/api/v1/connector-control/ingress
      CONNECTOR_CA_CERT: /pki/local-test-ca.cert.pem
    volumes:
      - type: bind
        source: ${MEDTRUST_CONNECTOR_DATA_ROOT}
        target: /var/lib/medtrust-connector
      - type: bind
        source: ${MEDTRUST_CONNECTOR_PKI_ROOT}
        target: /pki
        read_only: true
    depends_on:
      - connector-ingress
    restart: unless-stopped

  hospital-connector-revoke:
    build:
      context: .
      dockerfile: hospital-connector/Dockerfile
    ports:
      - "127.0.0.1:18601:18600"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CONNECTOR_DATA_ROOT: /var/lib/medtrust-connector
      CONNECTOR_CENTRAL_URL: http://host.docker.internal:8000/api/v1/connector-control
      CONNECTOR_INGRESS_URL: https://connector-ingress:8443/api/v1/connector-control/ingress
      CONNECTOR_CA_CERT: /pki/local-test-ca.cert.pem
    volumes:
      - type: bind
        source: ${MEDTRUST_CONNECTOR_REVOKE_DATA_ROOT}
        target: /var/lib/medtrust-connector
      - type: bind
        source: ${MEDTRUST_CONNECTOR_PKI_ROOT}
        target: /pki
        read_only: true
    depends_on:
      - connector-ingress
    restart: unless-stopped
