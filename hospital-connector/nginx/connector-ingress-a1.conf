server {
  listen 8443 ssl;
  server_name connector-ingress;
  ssl_certificate /pki/ingress.cert.pem;
  ssl_certificate_key /pki/ingress.key.pem;
  ssl_client_certificate /pki/local-test-ca.cert.pem;
  ssl_verify_client on;
  ssl_protocols TLSv1.2 TLSv1.3;
  location / {
    proxy_set_header X-Connector-Ingress-Verified true;
    proxy_set_header X-Client-Certificate-Subject $ssl_client_s_dn;
    proxy_set_header X-Client-Certificate-Fingerprint $ssl_client_fingerprint;
    proxy_set_header X-Client-Certificate $ssl_client_escaped_cert;
    proxy_pass http://backend:8000;
  }
}
