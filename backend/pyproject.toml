[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "medtrust-space-backend"
version = "0.1.0"
description = "MedTrust Space modular monolith backend skeleton"
readme = "README_backend.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18.5,<1.19.0",
  "asyncpg>=0.31.0,<0.32.0",
  "fastapi>=0.139.2,<0.140.0",
  "minio>=7.2.0,<8.0.0",
  "pydantic-ai-slim[openai]>=2.35.3,<2.36.0",
  "pydantic-settings>=2.14.2,<2.15.0",
  "pyyaml>=6.0.2,<7.0.0",
  "sqlalchemy[asyncio]>=2.0.51,<2.1.0",
  "uvicorn[standard]>=0.51.0,<0.52.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.22.1,<0.23.0",
  "httpx2>=2.7,<3.0",
  "pytest>=8.0,<10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires a dedicated migrated PostgreSQL test database",
]
