services:
  backend:
    environment:
      MEDTRUST_DEMO_API_ENABLED: "true"
      MEDTRUST_CORS_ORIGINS: http://127.0.0.1:8080
      MEDTRUST_TRUSTED_ORIGINS: http://127.0.0.1:8080
      MEDTRUST_DEMO_HOSPITAL_PASSWORD: ${MEDTRUST_DEMO_HOSPITAL_PASSWORD}
      MEDTRUST_DEMO_MODEL_PASSWORD: ${MEDTRUST_DEMO_MODEL_PASSWORD}
      MEDTRUST_DEMO_REQUESTER_PASSWORD: ${MEDTRUST_DEMO_REQUESTER_PASSWORD}
      MEDTRUST_DEMO_OPERATOR_PASSWORD: ${MEDTRUST_DEMO_OPERATOR_PASSWORD}
      MEDTRUST_CONNECTOR_PKI_ROOT: /var/lib/medtrust/connector-pki
      MEDTRUST_OPENSSL: /usr/bin/openssl
    volumes:
      - type: bind
        source: ${MEDTRUST_CONNECTOR_PKI_ROOT}
        target: /var/lib/medtrust/connector-pki
